[package]
name = "rlv"
version = "0.1.0"
edition = "2021"

[dependencies]
# GUI
eframe = "0.34"
egui = "0.34"

# File watching (tail -f)
notify = "8"

# Regex — PCRE-compatible
fancy-regex = "0.14"

# Fast byte-level substring search (SIMD-accelerated)
memchr = "2"

# Memory-mapped file streaming
memmap2 = "0.9"

# Temp files for decompressed content
tempfile = "3"

# .tar.gz support
flate2 = "1"
tar = "0.4"

# Clipboard (Ctrl+C copy)
arboard = "3"

# Native file dialogs
rfd = "0.15"